appId: com.velarix.bot
productName: VelarixBot
artifactName: VelarixBot-${version}-${arch}.${ext}

# Internal/manual distribution: artifacts are attached to private GitHub
# Releases. There is deliberately no anonymous auto-update feed.
directories:
  buildResources: build
  output: release

files:
  - electron/**
  - "!electron/resources/speech-helper"
  - "!electron/resources/cua-driver"
  - "!electron/resources/cua-driver.exe"
  - "!electron/vendor/**"
  - "!**/node_modules/**"
  - package.json

asar: true

# node_modules ship nowhere; the server's ONE native dependency
# (better-sqlite3, an N-API addon with an in-package prebuild) is staged by
# scripts/stage-sqlite.mjs and loaded from resources/server-deps by
# server/db/sqlite-native.ts. Never let electron-builder rebuild repo
# node_modules against Electron — N-API needs no rebuild and the dev tree
# must stay loadable by plain node.
npmRebuild: false

extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server
  - from: build/generated-server-deps
    to: server-deps

mac:
  identity: "-"
  target:
    - target: dmg
      arch:
        - arm64
  extraResources:
    - from: electron/resources/speech-helper
      to: speech-helper
    - from: electron/resources/cua-driver
      to: cua-driver
    - from: build/generated-cua-sdk/node_modules/@trycua
      to: cua-sdk/node_modules/@trycua
    - from: build/generated-cua-sdk/node_modules/@ubjs
      to: cua-sdk/node_modules/@ubjs
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: VelarixBot uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: VelarixBot transcribes your voice on-device to type messages for you.

dmg:
  sign: false
  artifactName: VelarixBot-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: electron/resources/cua-driver.exe
      to: cua-driver.exe
    - from: build/generated-cua-sdk/node_modules/@trycua
      to: cua-sdk/node_modules/@trycua
    - from: build/generated-cua-sdk/node_modules/@ubjs
      to: cua-sdk/node_modules/@ubjs
  icon: build/icon.ico
  artifactName: VelarixBot-Setup-${version}-${arch}.${ext}
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VelarixBot
  artifactName: VelarixBot-Setup-${version}-${arch}.${ext}
  include: build/installer.nsh
