name: Internal desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version: 0.x.x full release or 0.x.x-rc.N prerelease (for example 0.2.0 or 0.2.0-rc.18)"
        required: true
        type: string
      accepted_sha:
        description: "Full commit SHA approved by the QA/Test Lead"
        required: true
        type: string
      acceptance_record_url:
        description: "URL to the completed exact-SHA acceptance record"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: internal-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: exact-sha-release
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate version
        id: version
        run: node scripts/release-version.mjs --github-output "${{ inputs.version }}"
      - name: Validate accepted SHA and required CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
          ACCEPTANCE_RECORD_URL: ${{ inputs.acceptance_record_url }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ACCEPTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          [[ "$ACCEPTANCE_RECORD_URL" =~ ^https:// ]]
          matches="$(gh api "repos/${{ github.repository }}/commits/$ACCEPTED_SHA/check-runs" \
            --jq "[.check_runs[] | select(.name == \"exact-sha-release-gate\" and .head_sha == \"$ACCEPTED_SHA\" and .status == \"completed\" and .conclusion == \"success\" and .app.slug == \"github-actions\")] | length")"
          test "$matches" -ge 1
          printf "accepted_sha=%s\nacceptance_record=%s\nrequired_check_matches=%s\n" \
            "$ACCEPTED_SHA" "$ACCEPTANCE_RECORD_URL" "$matches"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  mac:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set package version
        shell: bash
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: pnpm build
      - run: pnpm build:server
      - run: pnpm stage:sqlite
      - run: pnpm build:speech
      - run: pnpm fetch:cua
      - run: pnpm stage:cua-sdk
      - name: Package arm64 DMG
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged server is the just-built one
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-packaged-server.mjs --packaged \
            release/mac-arm64/VelarixBot.app/Contents/Resources/server/index.js
      - name: Smoke packaged server (headless)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-packaged-server.mjs \
            release/mac-arm64/VelarixBot.app/Contents/Resources/server/index.js
      - name: Verify DMG and packaged runtime resources
        shell: bash
        run: |
          set -euo pipefail
          dmg="release/VelarixBot-${{ inputs.version }}-arm64.dmg"
          # electron-builder 26 defaultArch is x64, so arm64 always unpacks to mac-arm64/ even on ARM hosts.
          app="release/mac-arm64/VelarixBot.app"
          test -f "$dmg"
          hdiutil verify "$dmg"
          test -x "$app/Contents/Resources/speech-helper"
          test -x "$app/Contents/Resources/cua-driver"
          file "$app/Contents/Resources/speech-helper" | grep -q "universal binary"
          file "$app/Contents/Resources/cua-driver" | grep -q "universal binary"
          test -f "$app/Contents/Resources/cua-sdk/node_modules/@trycua/cua-driver/dist/embedded.js"
          codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: velarixbot-mac-arm64-${{ inputs.version }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set package version
        shell: bash
        run: pnpm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: pnpm package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged server is the just-built one
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-packaged-server.mjs --packaged \
            release/win-unpacked/resources/server/index.js
      - name: Smoke packaged server (headless)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-packaged-server.mjs \
            release/win-unpacked/resources/server/index.js
      - name: Verify unsigned x64 installer
        shell: pwsh
        run: |
          $path = "release/VelarixBot-Setup-${{ inputs.version }}-x64.exe"
          if (-not (Test-Path $path)) { throw "Installer missing: $path" }
          if (Test-Path "release/win-unpacked/resources/speech-helper") { throw "macOS speech helper leaked into Windows package" }
          $signature = Get-AuthenticodeSignature $path
          if ($signature.Status -ne "NotSigned") { throw "Expected manual-trust unsigned installer, got $($signature.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: velarixbot-windows-x64-${{ inputs.version }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [validate, mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: velarixbot-*-${{ inputs.version }}
          path: release-assets
          merge-multiple: true
      - name: Generate and verify checksums
        working-directory: release-assets
        run: |
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            extra+=(--prerelease)
          fi
          tag="v${{ inputs.version }}"
          sha="${{ github.sha }}"
          # Tag the built SHA first. `gh release create --target SHA` 403s when
          # main has moved and the range to HEAD includes workflow-file changes;
          # GITHUB_TOKEN cannot be granted workflows scope. An existing tag lets
          # the release attach without --target.
          if existing="$(gh api "repos/${{ github.repository }}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null)"; then
            if [ "$existing" != "$sha" ]; then
              echo "Tag ${tag} already points at ${existing}, expected ${sha}" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${sha}"
          fi
          gh release create "v${{ inputs.version }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "VelarixBot v${{ inputs.version }}" \
            "${extra[@]}" \
            --generate-notes \
            --notes "$RELEASE_NOTES"
