name: Exact-SHA CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional full commit SHA; the run fails if checkout differs"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: exact-sha-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    # Keep this context stable. Repository admins must require
    # "exact-sha-release-gate" on main; see docs/product/exact-sha-release-gate.md.
    name: exact-sha-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
    steps:
      - name: Check out the exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$EXPECTED_SHA"
          if [ -n "$DISPATCH_EXPECTED_SHA" ]; then
            [[ "$DISPATCH_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$actual" = "$DISPATCH_EXPECTED_SHA"
          fi
          printf 'verified_sha=%s\n' "$actual"
          printf 'parent_sha=%s\n' "$(git rev-parse HEAD^)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify supported runtime
        run: |
          node --version
          corepack pnpm --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 24) process.exit(1)"

      - name: Frozen dependency install
        run: corepack pnpm install --frozen-lockfile

      - name: Validate gate wiring and command surface
        run: corepack pnpm verify:release-gate

      - name: Repository lint and format checks
        run: corepack pnpm verify:lint-format

      - name: Secret inventory
        run: node scripts/secret-scan.mjs

      - name: Dependency security audit
        run: corepack pnpm audit --audit-level=high

      - name: Route, import, and security inventories
        run: corepack pnpm verify:inventories

      - name: Client, server, and Playwright TypeScript
        run: |
          corepack pnpm typecheck
          corepack pnpm typecheck:smoke

      - name: All unit and integration tests
        run: corepack pnpm test

      - name: Production client and server build
        run: |
          corepack pnpm build
          corepack pnpm build:server

      - name: Install pinned Chromium
        run: corepack pnpm exec playwright install chromium --with-deps

      - name: Deterministic Playwright E2E
        run: corepack pnpm test:e2e
