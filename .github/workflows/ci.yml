name: CI

# One Ubuntu job. typecheck, test, and the production UI build run together
# on the same runner, with the P0.6 gates (secret scan, dependency audit) as
# named steps in the SAME job — a PR cannot go green if any gate fails.
# macOS/Windows stay on the manual Portable workflow.
#
# PRs only. A merge to main already passed these checks on the PR, so a
# second run on push would just burn fair-use minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # exits 1 on any credential-shaped string in tracked files
      # (scripts/secret-scan.mjs, behavior pinned by server/secret-scan.test.ts)
      - name: secret scan
        run: node scripts/secret-scan.mjs
      # exits 1 on a known high/critical advisory in the lockfile
      - name: dependency audit
        run: pnpm audit --audit-level=high
      - name: typecheck, test, production UI build
        run: |
          pnpm typecheck
          pnpm test
          pnpm exec vite build
