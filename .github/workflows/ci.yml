name: CI

# One Ubuntu job. typecheck, test, and the production UI build run together
# on the same runner. macOS/Windows stay on the manual Portable workflow.
#
# PRs only. A merge to main already passed these checks on the PR, so a
# second run on push would just burn fair-use minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck, test, production UI build
        run: |
          pnpm typecheck
          pnpm test
          pnpm exec vite build
