# Playwright + LLM-judge eval. Weekday daytime Europe/Amsterdam + manual dispatch.
# Does not publish, tag, or edit release artifacts. Not on pull_request.
# Secrets (values never logged or committed):
#   CLAUDE_CODE_OAUTH_TOKEN  — Claude CLI OAuth (claude setup-token)
#   CODEX_AUTH_JSON          — full ~/.codex/auth.json contents
#   XAI_API_KEY              — optional; never required. Judge is report-only.
# Gate is claude || codex. Skips cleanly (exit 0) when those secrets are absent.
# Spend cap: repo var TIER_B_MAX_TURNS (default 40 in eval/turns.mjs).
name: Playwright eval

on:
  schedule:
    # 08:00 Europe/Amsterdam weekdays. GitHub cron is UTC.
    # CEST (summer): 08:00 Amsterdam = 06:00 UTC.
    # CET (winter): 08:00 Amsterdam = 07:00 UTC; 06:00 UTC is 07:00 Amsterdam —
    # still morning, not overnight, not weekends.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: playwright + judge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      EVAL_ARTIFACTS: ${{ github.workspace }}/eval-artifacts
      TIER_B_MAX_TURNS: ${{ vars.TIER_B_MAX_TURNS }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate (skip without Claude/Codex secrets)
        id: gate
        run: node eval/run.mjs --gate
      - name: Install Chromium
        if: steps.gate.outputs.ran == 'true'
        run: pnpm exec playwright install chromium --with-deps
      - name: Install agent CLIs
        if: steps.gate.outputs.ran == 'true'
        shell: bash
        run: |
          set +x
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then npm i -g @anthropic-ai/claude-code; fi
          if [ -n "${CODEX_AUTH_JSON:-}" ]; then npm i -g @openai/codex; fi
      - name: Run Playwright eval
        if: steps.gate.outputs.ran == 'true'
        shell: bash
        run: |
          set +x
          node eval/run.mjs
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ran == 'true' && (success() || failure())
        with:
          name: playwright-eval
          path: eval-artifacts/
          if-no-files-found: ignore
          retention-days: 14
